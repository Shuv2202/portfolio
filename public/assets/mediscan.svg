<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background app canvas -->
  <rect width="800" height="500" rx="12" fill="#0f172a"/>
  
  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="52" fill="#1e293b"/>
  <circle cx="28" cy="26" r="6" fill="#ef4444"/>
  <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="26" r="6" fill="#10b981"/>
  <text x="100" y="31" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">MediScan AI — Medical Report Analyzer &amp; Health Insights</text>
  
  <!-- App Badge -->
  <rect x="660" y="14" width="110" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="715" y="30" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">AI ENABLED</text>

  <!-- Left Sidebar / Patient Summary Card -->
  <rect x="24" y="72" width="230" height="400" rx="8" fill="#1e293b"/>
  <rect x="40" y="90" width="48" height="48" rx="24" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="64" y="120" fill="#60a5fa" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">🏥</text>

  <text x="100" y="105" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Lab Analysis</text>
  <text x="100" y="122" fill="#64748b" font-family="sans-serif" font-size="11">Report #MS-94021</text>

  <rect x="40" y="155" width="198" height="1" fill="#334155"/>

  <text x="40" y="180" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">PATIENT METRICS</text>
  <text x="40" y="202" fill="#e2e8f0" font-family="sans-serif" font-size="13">Hemoglobin: <tspan fill="#10b981" font-weight="700">14.2 g/dL</tspan></text>
  <text x="40" y="226" fill="#e2e8f0" font-family="sans-serif" font-size="13">Fasting Glucose: <tspan fill="#f59e0b" font-weight="700">108 mg/dL</tspan></text>
  <text x="40" y="250" fill="#e2e8f0" font-family="sans-serif" font-size="13">Total Cholesterol: <tspan fill="#10b981" font-weight="700">185 mg/dL</tspan></text>
  <text x="40" y="274" fill="#e2e8f0" font-family="sans-serif" font-size="13">Vitamin D3: <tspan fill="#ef4444" font-weight="700">18.4 ng/mL</tspan></text>

  <!-- Sidebar AI Status Pill -->
  <rect x="40" y="310" width="198" height="42" rx="6" fill="#0f172a"/>
  <text x="52" y="330" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">⚡ AI Summary Ready</text>
  <text x="52" y="344" fill="#64748b" font-family="sans-serif" font-size="10">4 key biomarkers analyzed</text>

  <!-- Main Content Area: AI Analysis Panel -->
  <rect x="274" y="72" width="502" height="400" rx="8" fill="#1e293b"/>

  <!-- Top Banner Inside Main Content -->
  <rect x="298" y="94" width="454" height="68" rx="8" fill="#0f172a"/>
  <text x="316" y="120" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="700">MediScan Health Insight Overview</text>
  <text x="316" y="142" fill="#94a3b8" font-family="sans-serif" font-size="12">Overall blood chemistry profile is healthy with mild Vitamin D insufficiency noted.</text>

  <!-- Key Clinical Observations Cards -->
  <rect x="298" y="178" width="218" height="130" rx="8" fill="#0f172a" stroke="#334155"/>
  <rect x="314" y="194" width="70" height="20" rx="4" fill="#10b981" fill-opacity="0.2"/>
  <text x="349" y="208" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">NORMAL</text>
  <text x="314" y="234" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Lipid Profile</text>
  <text x="314" y="254" fill="#94a3b8" font-family="sans-serif" font-size="11">Total cholesterol and HDL ratios are within optimal cardiac range.</text>

  <rect x="534" y="178" width="218" height="130" rx="8" fill="#0f172a" stroke="#334155"/>
  <rect x="550" y="194" width="80" height="20" rx="4" fill="#ef4444" fill-opacity="0.2"/>
  <text x="590" y="208" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ATTENTION</text>
  <text x="550" y="234" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Vitamin D Deficit</text>
  <text x="550" y="254" fill="#94a3b8" font-family="sans-serif" font-size="11">Serum D3 is below 20 ng/mL. Dietary supplementation suggested.</text>

  <!-- AI Recommendations Bar -->
  <rect x="298" y="324" width="454" height="130" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="316" y="350" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700">🤖 AI Doctor Summary &amp; Recommendations</text>
  <text x="316" y="374" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Fasting blood sugar is borderline normal (108 mg/dL). Consider low-glycemic meal options.</text>
  <text x="316" y="396" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Re-test Vit D3 levels in 8-12 weeks following supplementation.</text>
  <text x="316" y="418" fill="#cbd5e1" font-family="sans-serif" font-size="11">• All liver &amp; renal enzymes (ALT, AST, Creatinine) are well balanced.</text>
</svg>
